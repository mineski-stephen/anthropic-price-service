# Cloudflare Workers: runs src/worker.js (which runs src/service.js, the same code Node runs).
# Deployed as "anthropic-price-service" (https://anthropic-price-service.stephen-lin.workers.dev):
#   npx wrangler deploy
# Quick (Haiku) and the saved searches are meant to fit the free plan's 10 ms of CPU.
# Standard (Sonnet) and Thorough (Opus) read larger streams; if they hit the limit, on Workers Paid add
#   [limits]
#   cpu_ms = 30000
#
# Settings are NOT in this file. Add them under the Worker > Settings > Variables and Secrets:
#   ANTHROPIC_API_KEY    as a secret (required)
#   ALLOWED_ORIGINS      the hosted page's origin (never *)
#   (REQUIRE_LARK_LOGIN stays on; LARK_BASE_TOKEN / LARK_TABLE_ID default to the procurement table,
#   SEARCHES_TABLE_ID to its "Price searches" table, where every search is saved)
name = "anthropic-price-service"
main = "src/worker.js"
compatibility_date = "2026-05-01"
keep_vars = true

# Past costings: anthropic-ce's CE line items (read only). The same database anthropic-ce uses for
# Suppliers' Line Items tab; uploaded from tech/anthropic-ce after each CE pipeline run.
[[d1_databases]]
binding = "DB"
database_name = "ce-data"
database_id = "fc855676-806a-4e1a-bfe1-5041759e71aa"

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[observability]
enabled = true
